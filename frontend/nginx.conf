server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /health {
        set $backend_host backend;
        proxy_pass http://$backend_host:8000$request_uri;
    }

    location /auth {
        set $backend_host backend;
        proxy_pass http://$backend_host:8000$request_uri;
    }

    location /incidents {
        set $backend_host backend;
        proxy_pass http://$backend_host:8000$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
